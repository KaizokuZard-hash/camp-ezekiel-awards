<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Ezekiel Awards — Live Leaderboard</title>
<meta name="description" content="Big-screen live vote tally for the Camp Ezekiel Awards.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08060c">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8c469;--gold-bright:#ffeab0;--gold-deep:#a8781f;
  --ink:#08060c;--text:#f4ede0;--muted:#a79d8d;
  --line:rgba(232,196,105,.26);--line-soft:rgba(255,255,255,.09);
  --r-south:#f5a623;--r-midwest:#37c98b;--r-northeast:#5b8dff;--r-southeast:#ff6b9d;--r-west:#a970ff;
  --display:"Playfair Display",Georgia,serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
.stage{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% -10%,rgba(232,196,105,.16),transparent 60%),
             radial-gradient(90% 60% at 50% 110%,rgba(90,60,160,.18),transparent 65%)}
.beam{position:absolute;top:-40vh;left:50%;width:34vw;height:150vh;transform-origin:50% 0;filter:blur(30px);mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(232,196,105,.20),rgba(232,196,105,.05) 45%,transparent 78%)}
.beam.b1{margin-left:-46vw;animation:sway1 13s ease-in-out infinite}
.beam.b2{margin-left:12vw;animation:sway2 17s ease-in-out infinite}
@keyframes sway1{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-7deg)}}
@keyframes sway2{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(6deg)}}

.top{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding:22px clamp(20px,4vw,54px);border-bottom:1px solid var(--line-soft);
}
.brandline{font-size:clamp(.62rem,1.2vw,.78rem);letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Way back to the ballot — without it this page is a dead end on a phone. */
.back{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  min-height:44px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--gold);text-decoration:none;
  font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  transition:background .18s,color .18s,transform .18s;
  -webkit-tap-highlight-color:transparent;
}
.back:hover{background:rgba(232,196,105,.12);color:var(--gold-bright)}
.back:active{transform:scale(.96)}
.back:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.back svg{width:14px;height:14px;fill:currentColor;flex:none}
.live{display:flex;align-items:center;gap:10px;font-size:clamp(.62rem,1.2vw,.8rem);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.live b{color:var(--gold-bright);font-variant-numeric:tabular-nums}

main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(20px,3vh,44px) clamp(20px,5vw,72px);min-height:0}
.slide{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.tag{font-size:clamp(.6rem,1.3vw,.85rem);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
h1{font-family:var(--display);font-weight:800;margin:0 0 6px;line-height:1;
  font-size:clamp(2rem,6.4vw,5rem);letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--gold-bright) 8%,var(--gold) 52%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:clamp(.75rem,1.5vw,1rem);letter-spacing:.06em;margin:0 0 clamp(18px,3.4vh,38px)}

.rows{display:flex;flex-direction:column;gap:clamp(10px,2.1vh,22px)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(12px,2vw,24px)}
.rank{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2.6vw,2.1rem);color:var(--gold-deep);
  min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums}
.row.leader .rank{color:var(--gold-bright)}
.mid{min-width:0}
.name{display:flex;align-items:center;gap:10px;font-weight:600;
  font-size:clamp(.85rem,1.9vw,1.4rem);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .swatch{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.row.leader .name{color:var(--gold-bright)}
.trackbar{height:clamp(10px,1.8vh,18px);border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,#000),var(--c));
  transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row.leader .fill{box-shadow:0 0 22px -2px var(--c)}
.score{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,2.4rem);line-height:1}
.score span{font-size:clamp(.6rem,1.1vw,.78rem);color:var(--muted);letter-spacing:.1em}

.bottom{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,2vw,16px);flex-wrap:wrap;
  padding:14px clamp(12px,3vw,24px) calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-soft);
}

/* Touch controls. The projector has a keyboard; a phone does not. */
.ctrl{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-width:44px;min-height:44px;padding:0 16px;
  border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--gold);font-family:var(--ui);font-weight:700;
  font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  transition:background .18s,transform .18s,color .18s;
  -webkit-tap-highlight-color:transparent;
}
.ctrl:hover{background:rgba(232,196,105,.12);color:var(--gold-bright)}
.ctrl:active{transform:scale(.95)}
.ctrl:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.ctrl svg{width:14px;height:14px;fill:currentColor}
.ctrl[aria-pressed="true"]{background:rgba(232,196,105,.18);color:var(--gold-bright);border-color:var(--gold)}

/* Pips are real buttons now — tap one to jump straight to that award. */
.pips{display:flex;gap:4px;align-items:center}
.pips button{
  width:28px;min-height:44px;padding:0;border:0;background:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.pips button i{
  display:block;width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.20);transition:background .3s,transform .3s;
}
.pips button[aria-current="true"] i{background:var(--gold);transform:scale(1.45);box-shadow:0 0 10px var(--gold)}
.pips button:hover i{background:var(--gold-bright)}
.pips button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:-4px;border-radius:8px}

.hint{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
/* Keyboard hints are noise on a touch device. */
@media(hover:none),(max-width:720px){ .hint{display:none} }

/* On a phone the slide must fit without the controls being pushed off-screen. */
@media(max-width:720px){
  body{overflow:auto}
  main{justify-content:flex-start;padding-top:18px}
  /* Three items don't fit at 375px; the title is the least useful of them. */
  .top{padding:12px 14px;gap:10px}
  .brandline{display:none}
  .back{padding:0 12px}
  .ctrl{padding:0 13px;font-size:.66rem}
  .ctrl .label{display:none}
  .ctrl svg{width:16px;height:16px}
  .ctrl.play .label{display:inline}
  /* 28px is a tall-but-thin target; give thumbs the full 44px both ways.
     The row wraps onto its own line at this width, which is fine. */
  .pips button{width:44px}
  .pips{gap:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="stage" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div></div>

<div class="top">
  <a class="back" href="/" aria-label="Back to the ballot">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.6-1.6L11 12l6-5.8z"/></svg>
    <span class="label">Ballot</span>
  </a>
  <div class="brandline">The Camp Ezekiel Awards</div>
  <div class="live"><span class="dot"></span> Live · <b id="ballots">0</b> ballots</div>
</div>

<main><div class="slide" id="slide"></div></main>

<div class="bottom">
  <button class="ctrl" type="button" id="prevBtn" aria-label="Previous award">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.6-1.6L11 12l6-5.8z"/></svg>
    <span class="label">Prev</span>
  </button>

  <div class="pips" id="pips" role="group" aria-label="Jump to an award"></div>

  <button class="ctrl play" type="button" id="playBtn" aria-pressed="false" aria-label="Pause auto-rotation">
    <svg viewBox="0 0 24 24" aria-hidden="true" id="playIcon"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
    <span class="label" id="playLabel">Pause</span>
  </button>

  <button class="ctrl" type="button" id="nextBtn" aria-label="Next award">
    <span class="label">Next</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 4.6 16 12l-7.4 7.4L7 17.8 13 12 7 6.2z"/></svg>
  </button>

  <span class="hint">&larr; &rarr; to change · Space to hold</span>
</div>

<script>
(function(){
  "use strict";

  const AWARDS = [
    { id:'overall',  tag:'Overall Standings', title:'Region of the Night', sub:'Total votes across all four awards' },
    { id:'fomo',     tag:'The FOMO Award',    title:"I Should've Gone To That Camp", sub:'The camp that gave everybody the biggest FOMO' },
    { id:'stealing', tag:'The Grand Larceny Award', title:"We're Stealing This Next Year", sub:'The idea every other region wishes they had first' },
    { id:'cook',     tag:"The Chef's Special", title:'Who Let Them Cook', sub:'The most creative, unexpected, outside-the-box idea' },
    { id:'runback',  tag:'The Encore Award',   title:'Run That Back', sub:'The activity everybody wants back next year' }
  ];

  const REGIONS = [
    { id:'south',     name:'South Region',      color:'var(--r-south)' },
    { id:'midwest',   name:'Midwest Region',    color:'var(--r-midwest)' },
    { id:'northeast', name:'North East Region', color:'var(--r-northeast)' },
    { id:'southeast', name:'South East Region', color:'var(--r-southeast)' },
    { id:'west',      name:'West Region',       color:'var(--r-west)' }
  ];

  const ROTATE_MS = 9000;
  const POLL_MS = 6000;

  let index = 0;
  let paused = false;
  let data = null;
  let rotateTimer = null;

  const $ = (id) => document.getElementById(id);

  // Each pip is a button so a phone can jump straight to an award.
  $('pips').innerHTML = AWARDS.map((a, i) => `
    <button type="button" data-index="${i}" aria-current="false"
            aria-label="Show ${a.title}"><i></i></button>`).join('');

  $('pips').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-index]');
    if (!btn) return;
    index = Number(btn.dataset.index);
    render();
    restartRotation();
  });

  function countsFor(awardId){
    if (!data) return {};
    if (awardId === 'overall') return data.overall || {};
    return (data.awards && data.awards[awardId] && data.awards[awardId].regions) || {};
  }

  function render(){
    const award = AWARDS[index];
    const counts = countsFor(award.id);

    const ranked = REGIONS
      .map(r => ({ ...r, votes: counts[r.id] || 0 }))
      .sort((a, b) => b.votes - a.votes || a.name.localeCompare(b.name));

    const total = ranked.reduce((sum, r) => sum + r.votes, 0);
    const top = ranked.length ? ranked[0].votes : 0;

    $('slide').innerHTML = `
      <div class="tag">${award.tag}</div>
      <h1>${award.title}</h1>
      <p class="sub">${award.sub} · ${total} vote${total === 1 ? '' : 's'} counted</p>
      <div class="rows">
        ${ranked.map((r, i) => `
          <div class="row ${total > 0 && r.votes === top ? 'leader' : ''}" style="--c:${r.color}">
            <div class="rank">${i + 1}</div>
            <div class="mid">
              <div class="name"><span class="swatch"></span>${r.name}</div>
              <div class="trackbar"><i class="fill" style="width:${top ? (r.votes / top * 100) : 0}%"></i></div>
            </div>
            <div class="score"><b>${r.votes}</b><span>${total ? Math.round(r.votes / total * 100) : 0}%</span></div>
          </div>`).join('')}
      </div>`;

    // Re-trigger the entrance animation on each slide change.
    $('slide').style.animation = 'none';
    void $('slide').offsetWidth;
    $('slide').style.animation = '';

    [...$('pips').children].forEach((pip, i) =>
      pip.setAttribute('aria-current', String(i === index)));
    $('ballots').textContent = (data && data.ballots || 0).toLocaleString();
  }

  function go(step){
    index = (index + step + AWARDS.length) % AWARDS.length;
    render();
    restartRotation();
  }

  function restartRotation(){
    clearInterval(rotateTimer);
    if (!paused) rotateTimer = setInterval(() => go(1), ROTATE_MS);
  }

  async function poll(){
    try {
      const res = await fetch('/api/results', { cache:'no-store' });
      if (!res.ok) return;
      data = await res.json();
      render();
    } catch (e) {}
  }

  const PLAY_ICON  = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_ICON = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';

  function setPaused(next){
    paused = next;
    $('playIcon').innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
    $('playLabel').textContent = paused ? 'Play' : 'Pause';
    $('playBtn').setAttribute('aria-pressed', String(paused));
    $('playBtn').setAttribute('aria-label', paused ? 'Resume auto-rotation' : 'Pause auto-rotation');
    restartRotation();
  }

  $('prevBtn').addEventListener('click', () => go(-1));
  $('nextBtn').addEventListener('click', () => go(1));
  $('playBtn').addEventListener('click', () => setPaused(!paused));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  });

  // Swipe left/right on touch. Ignores mostly-vertical drags so scrolling still works.
  let touchX = null, touchY = null;
  const SWIPE_MIN = 45;
  document.addEventListener('touchstart', (e) => {
    touchX = e.changedTouches[0].clientX;
    touchY = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    touchX = touchY = null;
  }, { passive: true });

  render();
  poll();
  setInterval(poll, POLL_MS);
  restartRotation();
})();
</script>
</body>
</html>
